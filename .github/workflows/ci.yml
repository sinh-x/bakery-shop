name: CI

on:
  pull_request:
    branches: [develop, main]
  push:
    branches: [develop]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  filter:
    # Phase 4.7 — path-based job filtering. Detects which stack areas changed
    # and exports boolean outputs used by downstream jobs' `if:` conditions so
    # a Python-only PR skips the Flutter job (and vice versa), while a change
    # to shared/root files (or any file outside both stack filters) triggers
    # both stacks as a conservative fallback (FR6, AC6).
    runs-on: ubuntu-latest
    outputs:
      python: ${{ steps.f.outputs.python }}
      flutter: ${{ steps.f.outputs.flutter }}
      docker: ${{ steps.f.outputs.docker }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Detect changed areas
        id: f
        run: |
          set -euo pipefail
          # Determine the base commit to diff against. Use merge-base to find
          # the common ancestor, which is robust on first push of a new branch
          # where the base ref may not be present locally (OPS-2).
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            BASE="${{ github.event.pull_request.base.sha }}"
          else
            BEFORE="${{ github.event.before }}"
            if [ "$BEFORE" = "0000000000000000000000000000000000000000" ]; then
              BASE="HEAD~1"
            else
              BASE="$BEFORE"
            fi
          fi

          # List changed files (added/modified/deleted) relative to repo root.
          # Fall back through several strategies so a first-push branch whose
          # base ref is absent locally still resolves a usable diff range
          # (OPS-2): merge-base → HEAD~1 → empty (treated as first-push).
          if ! CHANGES=$(git diff --name-only "$BASE..HEAD" 2>/dev/null) || [ -z "$CHANGES" ]; then
            if ANCESTOR=$(git merge-base "$BASE" HEAD 2>/dev/null) && [ -n "$ANCESTOR" ]; then
              CHANGES=$(git diff --name-only "$ANCESTOR..HEAD" 2>/dev/null || echo "first-push")
            else
              CHANGES=$(git diff --name-only HEAD~1..HEAD 2>/dev/null || echo "first-push")
            fi
          fi

          echo "Changed files (base=$BASE):"
          echo "$CHANGES"

          py=0; fl=0; dk=0; fallback=0
          while IFS= read -r f; do
            [ -z "$f" ] && continue
            # Python stack filter: src/**, tests/**, pyproject.toml, uv.lock
            if [[ "$f" == src/* || "$f" == tests/* || "$f" == "pyproject.toml" || "$f" == "uv.lock" ]]; then
              py=1
            fi
            # Flutter stack filter: app/**
            if [[ "$f" == app/* ]]; then
              fl=1
            fi
            # Docker filter: src/**, Dockerfile
            if [[ "$f" == src/* || "$f" == "Dockerfile" ]]; then
              dk=1
            fi
            # Fallback: any file outside both stack filters (python + flutter)
            # triggers both stacks (shared/root files, unknown paths, etc.).
            if [[ "$f" != src/* && "$f" != tests/* && "$f" != app/* && "$f" != "pyproject.toml" && "$f" != "uv.lock" ]]; then
              fallback=1
            fi
          done <<< "$CHANGES"

          echo "python=$(( py || fallback ))" >> "$GITHUB_OUTPUT"
          echo "flutter=$(( fl || fallback ))" >> "$GITHUB_OUTPUT"
          echo "docker=$(( dk || fallback ))" >> "$GITHUB_OUTPUT"

  fast-gate:
    # Phase 4.3/4.4 — fast smoke tier as PR early-exit gate (<5 min target).
    # Phase 4.7 — only runs when the `filter` job detects Python-stack changes
    # or triggers the both-stacks fallback (FR6, AC6).
    needs: filter
    if: needs.filter.outputs.python == '1'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Cache Python dependencies (uv/pip)
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/uv
            ~/.cache/pip
          key: python-deps-${{ runner.os }}-${{ hashFiles('uv.lock') }}
          restore-keys: |
            python-deps-${{ runner.os }}-

      - name: Install dependencies
        run: pip install -e ".[dev,web]" ruff pytest-xdist

      - name: Lint (Ruff minimal)
        run: python -m ruff check src tests --select E9,F63,F7,F82

      - name: Fast gate tests
        # Phase 4.4 — runs `fast or critical` so critical-flow tests
        # (auth/payments/POS/migrations) are never skipped in the fast gate.
        # Phase 5.5 — `-n auto` parallelises via pytest-xdist so the 947-test
        # gate completes comfortably under the 5-min timeout (OPS-1).
        timeout-minutes: 5
        env:
          BAKER_BCRYPT_ROUNDS: "4"
        run: python -m pytest tests -v -n auto -m "fast or critical"

  python-tests:
    # Runs when Python source or config changes
    # Phase 4.7 — only runs when the `filter` job detects Python-stack changes
    # or triggers the both-stacks fallback (FR6, AC6). The full test suite
    # still runs on every qualifying PR (FR7).
    needs: filter
    if: needs.filter.outputs.python == '1'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Cache Python dependencies (uv/pip)
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/uv
            ~/.cache/pip
          key: python-deps-${{ runner.os }}-${{ hashFiles('uv.lock') }}
          restore-keys: |
            python-deps-${{ runner.os }}-

      - name: Install dependencies
        run: pip install -e ".[dev,web]" ruff pytest-xdist

      - name: Lint (Ruff minimal)
        run: python -m ruff check src tests --select E9,F63,F7,F82

      - name: Run tests
        timeout-minutes: 10
        env:
          # Lower bcrypt work factor in TEST only so the full suite completes
          # well under the 10-min cap. Production default stays 12 (NFR4).
          BAKER_BCRYPT_ROUNDS: "4"
        # Phase 4.5 — `--durations=25` surfaces the 25 slowest tests in the
        # job log so slow tests are visible (FR4, AC5). Non-gating.
        run: python -m pytest tests -v -n auto --durations=25

  flutter-checks:
    # Runs when Flutter app changes
    # Phase 4.7 — only runs when the `filter` job detects Flutter-stack changes
    # or triggers the both-stacks fallback (FR6, AC6).
    needs: filter
    if: needs.filter.outputs.flutter == '1'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.0'
          channel: stable
          cache: true

      - name: Cache Flutter pub dependencies
        uses: actions/cache@v4
        with:
          path: ~/.pub-cache
          key: flutter-pub-${{ runner.os }}-${{ hashFiles('app/pubspec.lock') }}
          restore-keys: |
            flutter-pub-${{ runner.os }}-

      - name: Get dependencies
        run: flutter pub get
        working-directory: app

      - name: Analyze
        run: flutter analyze
        working-directory: app

      - name: Analyze (Dart)
        run: dart analyze
        working-directory: app

      - name: Test with coverage
        # Phase 4.5 — surface Flutter test timing in the job log AND in the
        # GitHub Actions job summary ($GITHUB_STEP_SUMMARY) for slow-test
        # visibility (FR4, AC5). `--reporter compact` keeps per-test output
        # readable; the trailing summary lines (pass/fail counts + elapsed)
        # are written to the job summary by the next step. Non-gating.
        run: |
          set -o pipefail
          flutter test --coverage --reporter compact 2>&1 | tee /tmp/flutter-test.log
        working-directory: app

      - name: Flutter test timing summary
        # Phase 4.5 — write the tail of the test log (which includes the
        # pass/fail counts and total elapsed time) to the job summary so
        # Flutter test timing is visible alongside the pytest --durations
        # output from the python-tests job.
        if: always()
        run: |
          {
            echo "## Flutter test timing"
            echo "Tail of \`flutter test --coverage\` output:"
            echo '```'
            tail -n 15 /tmp/flutter-test.log 2>/dev/null || echo "(log unavailable)"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Check dependency health
        # Phase 4.4 (FR-CI-2) — enforce Flutter dependency freshness. Fails
        # the job when any direct dependency has a newer compatible version,
        # prompting maintainers to keep packages up to date.
        # OPS-1 (DG-308): scope to direct dependencies only (--no-dev-dependencies
        # --no-transitive) so unrelated transitive/dev dep updates don't block PRs.
        run: flutter pub outdated --no-color --no-dev-dependencies --no-transitive
        working-directory: app

      - name: Check code generation freshness
        run: |
          git checkout -- pubspec.lock
          dart run build_runner build --delete-conflicting-outputs
          git diff --exit-code
        working-directory: app

  docker-build:
    # Runs when backend source or Dockerfile changes
    # Phase 4.7 — only runs when the `filter` job detects Docker-relevant
    # changes (src/** or Dockerfile) or triggers the both-stacks fallback.
    needs: filter
    if: needs.filter.outputs.docker == '1'
    runs-on: ubuntu-latest
    # Phase 4.4 (FR-CI-4) — bound the build to avoid unbounded runner time.
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build .

  python-security:
    # Phase 4.4 (FR-CI-1) — Python SAST (Bandit) + dependency vulnerability
    # audit (pip-audit). Runs whenever the Python stack is exercised.
    needs: filter
    if: needs.filter.outputs.python == '1'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Cache Python dependencies (uv/pip)
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/uv
            ~/.cache/pip
          key: python-deps-${{ runner.os }}-${{ hashFiles('uv.lock') }}
          restore-keys: |
            python-deps-${{ runner.os }}-

      - name: Install dependencies
        run: pip install -e ".[dev,web]" bandit pip-audit

      - name: Bandit SAST scan
        # Phase 4.4 (FR-CI-1) — static security analysis of the Python source.
        # `-ll` restricts to medium+high severity; `-q` suppresses noise.
        # `--skip B608,B104` excludes two known false-positive classes:
        #   - B608 (hardcoded SQL): the codebase builds SQL from a fixed,
        #     allow-listed set of fragments with parameterized values (never
        #     user-controlled identifiers); 144 findings are all this pattern.
        #   - B104 (bind all interfaces): the server binds 0.0.0.0 by design
        #     (config.py HOST default) and is fronted by Caddy in production.
        run: bandit -r src -ll -q --skip B608,B104

      - name: pip-audit dependency vulnerability scan
        # Phase 4.4 (FR-CI-1/FR-CI-2) — audit installed dependencies against
        # the PyPA advisory database. Fails the job on known vulnerabilities.
        run: pip-audit --strict

  python-coverage:
    # Phase 4.4 (FR-CI-3) — enforce a minimum Python test coverage threshold.
    # Runs alongside the full python-tests job; gates on the coverage report.
    needs: filter
    if: needs.filter.outputs.python == '1'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Cache Python dependencies (uv/pip)
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/uv
            ~/.cache/pip
          key: python-deps-${{ runner.os }}-${{ hashFiles('uv.lock') }}
          restore-keys: |
            python-deps-${{ runner.os }}-

      - name: Install dependencies
        run: pip install -e ".[dev,web]" ruff pytest-xdist pytest-cov

      - name: Run tests with coverage
        # Phase 4.4 (FR-CI-3) — generate coverage report and enforce a
        # minimum line coverage threshold of 70%. `--cov-fail-under` makes
        # pytest exit non-zero when coverage drops below the threshold.
        timeout-minutes: 12
        env:
          BAKER_BCRYPT_ROUNDS: "4"
        run: python -m pytest tests -n auto --cov=baker --cov-report=term --cov-report=xml --cov-fail-under=70
