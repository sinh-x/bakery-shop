name: CI

on:
  pull_request:
    branches: [develop, main]
  push:
    branches: [develop]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  fast-gate:
    # Phase 4.3 — fast smoke tier as PR early-exit gate (<5 min target).
    # Runs only tests tagged `@pytest.mark.fast`. Shares the same Python
    # dependency cache as the `python-tests` job (same cache key) so a
    # cache-hit on either job benefits both. The full `python-tests` job
    # below continues to run on every PR — this is an additional gate,
    # not a replacement (FR7).
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Cache Python dependencies (uv/pip)
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/uv
            ~/.cache/pip
          key: python-deps-${{ runner.os }}-${{ hashFiles('uv.lock') }}
          restore-keys: |
            python-deps-${{ runner.os }}-

      - name: Install dependencies
        run: pip install -e ".[dev,web]" ruff pytest-xdist

      - name: Lint (Ruff minimal)
        run: python -m ruff check src tests --select E9,F63,F7,F82

      - name: Fast gate tests
        timeout-minutes: 5
        env:
          BAKER_BCRYPT_ROUNDS: "4"
        run: python -m pytest tests -v -m fast

  python-tests:
    # Runs when Python source or config changes
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Cache Python dependencies (uv/pip)
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/uv
            ~/.cache/pip
          key: python-deps-${{ runner.os }}-${{ hashFiles('uv.lock') }}
          restore-keys: |
            python-deps-${{ runner.os }}-

      - name: Install dependencies
        run: pip install -e ".[dev,web]" ruff pytest-xdist

      - name: Lint (Ruff minimal)
        run: python -m ruff check src tests --select E9,F63,F7,F82

      - name: Run tests
        timeout-minutes: 10
        env:
          # Lower bcrypt work factor in TEST only so the full suite completes
          # well under the 10-min cap. Production default stays 12 (NFR4).
          BAKER_BCRYPT_ROUNDS: "4"
        run: python -m pytest tests -v -n auto

  flutter-checks:
    # Runs when Flutter app changes
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.0'
          channel: stable
          cache: true

      - name: Cache Flutter pub dependencies
        uses: actions/cache@v4
        with:
          path: ~/.pub-cache
          key: flutter-pub-${{ runner.os }}-${{ hashFiles('app/pubspec.lock') }}
          restore-keys: |
            flutter-pub-${{ runner.os }}-

      - name: Get dependencies
        run: flutter pub get
        working-directory: app

      - name: Analyze
        run: flutter analyze
        working-directory: app

      - name: Analyze (Dart)
        run: dart analyze
        working-directory: app

      - name: Test with coverage
        run: flutter test --coverage
        working-directory: app

      - name: Check dependency health
        run: flutter pub outdated --no-color
        working-directory: app
        continue-on-error: true

      - name: Check code generation freshness
        run: |
          git checkout -- pubspec.lock
          dart run build_runner build --delete-conflicting-outputs
          git diff --exit-code
        working-directory: app

  docker-build:
    # Runs when backend source or Dockerfile changes
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build .
